name: Generate VATGlasses data

on:
  push:
    branches:
      - main
    paths:
      - 'inputs/**'
      - 'config/**'
      - 'outputs/groups.json'
      - 'outputs/callsigns.json'
      - 'generate_airports.py'
      - 'generate_airspaces.py'
      - 'generate_positions.py'
      - 'merge_all.py'
      - 'export_geojson.py'
      - 'export_viff.py'
      - 'vatglasses.py'
      - 'requirements.txt'
      - '.github/workflows/generate.yaml'
  workflow_dispatch:

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate airports
        run: python ./generate_airports.py

      - name: Generate airspaces
        run: python ./generate_airspaces.py

      - name: Generate positions
        run: python ./generate_positions.py

      - name: Merge VATGlasses file
        run: python ./merge_all.py --input-dir ./outputs --output-file ./outputs/lf.json

      - name: Export GeoJSON per flight level
        run: |
          for i in $(seq 0 10 390)
          do
            echo "Exporting GEOJSON for FL$i"
            python ./export_geojson.py --input-files ./outputs/lf.json --output-file ./exports/ctr_fl$i.geojson --flight-level $i --positions PAR BB EE MM RR
          done

      - name: Export vIFF airblocks
        run: python ./export_viff.py --input ./outputs/lf.json --output ./exports/airblocks.geojson

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'outputs/*.json outputs/missing_topdown.txt config/colors.yml exports/*.geojson'
          commit_message: 'Regenerate VATGlasses data and exports'
          commit_options: '--no-verify'
          branch: ${{ github.ref }}
